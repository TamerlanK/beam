name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: race tests
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./...
      - name: loadtest smoke
        run: go run ./cmd/loadtest -clients 40 -rooms 10 -transfers 5 -size 4194304
