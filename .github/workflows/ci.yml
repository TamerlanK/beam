name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: prettier
        run: npx -y prettier@3.6.2 --check web
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - name: race tests
        run: go test -race ./...
      - name: js tests
        run: node --test "web/test/**/*.test.mjs"
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./...
      - name: loadtest smoke
        run: go run ./cmd/loadtest -clients 40 -rooms 10 -transfers 5 -size 4194304
